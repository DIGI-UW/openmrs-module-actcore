name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
      development_version:
        description: 'Next development version (e.g., 1.1.0-SNAPSHOT)'
        required: true
      branch:
        description: 'Branch to release from (e.g., main)'
        required: false
        default: 'main'

jobs:
  release:
    uses: openmrs/openmrs-contrib-gha-workflows/.github/workflows/release-backend-module.yml@main
    permissions:
      contents: write
    with:
      release_version: ${{ inputs.release_version }}
      development_version: ${{ inputs.development_version }}
      branch: ${{ inputs.branch }}
      java_version: '8'
    secrets:
      # The shared job's GITHUB_TOKEN has no packages: write, so the release publishes as the bot.
      MAVEN_REPO_USERNAME: uwdigi
      MAVEN_REPO_API_KEY: ${{ secrets.GH_BOT_TOKEN }}
      BOT_PAT: ${{ secrets.BOT_PAT }}
