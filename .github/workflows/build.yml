name: Build with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: openmrs/openmrs-contrib-gha-workflows/.github/workflows/build-backend-module.yml@main
    with:
      # A push to main deploys the SNAPSHOT to DIGI-UW's repository, named in the pom's distributionManagement.
      deploy_snapshots: ${{ github.repository == 'DIGI-UW/openmrs-module-actcore' }}
    secrets:
      MAVEN_REPO_USERNAME: ${{ secrets.MAVEN_REPO_USERNAME }}
      # The DIGI-UW organization keeps the repository password as MAVEN_REPO_PASSWORD.
      MAVEN_REPO_API_KEY: ${{ secrets.MAVEN_REPO_PASSWORD }}
