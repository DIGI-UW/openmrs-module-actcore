name: Build with Maven

on:
  push:
    branches: [ main, "*.x" ]
  pull_request:
    branches: [ main, "*.x" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: openmrs/openmrs-contrib-gha-workflows/.github/workflows/build-backend-module.yml@main
    with:
      # Outside the openmrs org the shared workflow deploys SNAPSHOTs only when this is true.
      deploy_snapshots: ${{ github.repository_owner == 'DIGI-UW' }}
    secrets:
      # The same account and token the release publishes to GitHub Packages with.
      MAVEN_REPO_USERNAME: uwdigi
      MAVEN_REPO_API_KEY: ${{ secrets.GH_BOT_TOKEN }}
